<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMA Article Editor</title>
    <style>
        :root {
            --primary: #00a4bf;
            --secondary: #ce3a50;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        aside {
            width: 300px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .lang-column {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .lang-column h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .section-item {
            border: 1px solid #eee;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            position: relative;
        }
        .btn {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ddd; color: var(--text); }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .link-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <aside>
        <h2 style="margin:0; color:var(--primary)">ALMA Editor</h2>
        <p class="small" style="font-size: 0.8rem; color: #666;">Outil pour créer et éditer des articles pour alma-asso.fr</p>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="generateHTML()">Générer HTML</button>
            <button class="btn btn-outline" onclick="exportJSON()">Exporter JSON</button>
            <button class="btn btn-outline" onclick="triggerImport()">Importer JSON</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
        </div>

        <hr style="width:100%; border:0; border-top:1px solid #eee">
        
        <div>
            <label>Date de publication</label>
            <input type="date" id="article-date" value="2026-04-28">
        </div>
    </aside>

    <main>
        <div class="editor-grid">
            <!-- French Column -->
            <div class="lang-column" id="fr-column">
                <h2>Français (FR)</h2>
                <div class="form-group">
                    <label>Titre de l'article</label>
                    <input type="text" id="fr-title" placeholder="Ex: Démarches administratives">
                </div>
                <div class="form-group">
                    <label>Introduction</label>
                    <textarea id="fr-intro" placeholder="Texte d'introduction..."></textarea>
                </div>
                <div id="fr-sections">
                    <!-- Sections go here -->
                </div>
                <button class="btn btn-secondary" onclick="addSection()" style="width:100%; margin-bottom:1.5rem">+ Ajouter une section</button>

                <div class="form-group">
                    <label>Conclusion</label>
                    <textarea id="fr-conclusion" placeholder="Texte de conclusion..."></textarea>
                </div>
                <div class="form-group">
                    <label>Libellé "Liens utiles"</label>
                    <input type="text" id="fr-links-title" value="Liens utiles">
                </div>
                <div id="fr-links">
                    <!-- Links go here -->
                </div>
                <button class="btn btn-outline" onclick="addLink()" style="width:100%">+ Ajouter un lien utile</button>
            </div>

            <!-- Spanish Column -->
            <div class="lang-column" id="es-column">
                <h2>Español (ES)</h2>
                <div class="form-group">
                    <label>Título del artículo</label>
                    <input type="text" id="es-title" placeholder="Ej: Trámites administrativos">
                </div>
                <div class="form-group">
                    <label>Introducción</label>
                    <textarea id="es-intro" placeholder="Texto de introducción..."></textarea>
                </div>
                <div id="es-sections">
                    <!-- Sections go here -->
                </div>
                <div style="height: 52px; margin-bottom: 1.5rem;"></div> <!-- spacer -->

                <div class="form-group">
                    <label>Conclusión</label>
                    <textarea id="es-conclusion" placeholder="Texto de conclusión..."></textarea>
                </div>
                <div class="form-group">
                    <label>Etiqueta "Enlaces útiles"</label>
                    <input type="text" id="es-links-title" value="Enlaces útiles">
                </div>
                <div id="es-links">
                    <!-- Links go here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let sectionCount = 0;
        let linkCount = 0;

        function addSection(data = null) {
            const id = sectionCount++;
            ['fr', 'es'].forEach(lang => {
                const container = document.getElementById(`${lang}-sections`);
                const div = document.createElement('div');
                div.className = 'section-item';
                div.id = `section-${id}-${lang}`;
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem">
                        <label style="margin:0">Section ${id + 1}</label>
                        ${lang === 'fr' ? `<button class="btn btn-secondary" style="padding:2px 8px; font-size:10px" onclick="removeSection(${id})">Supprimer</button>` : ''}
                    </div>
                    <input type="text" id="${lang}-section-title-${id}" placeholder="${lang === 'fr' ? 'Titre de la section' : 'Título de la sección'}" style="margin-bottom:0.5rem" value="${data ? data[lang].title : ''}">
                    <textarea id="${lang}-section-text-${id}" placeholder="${lang === 'fr' ? 'Contenu de la section...' : 'Contenido de la sección...'}" value="">${data ? data[lang].text : ''}</textarea>
                `;
                container.appendChild(div);
            });
        }

        function removeSection(id) {
            document.getElementById(`section-${id}-fr`).remove();
            document.getElementById(`section-${id}-es`).remove();
        }

        function addLink(data = null) {
            const id = linkCount++;
            ['fr', 'es'].forEach(lang => {
                const container = document.getElementById(`${lang}-links`);
                const div = document.createElement('div');
                div.className = 'link-item';
                div.id = `link-${id}-${lang}`;
                div.innerHTML = `
                    <input type="text" id="${lang}-link-label-${id}" placeholder="${lang === 'fr' ? 'Libellé' : 'Etiqueta'}" value="${data ? data[lang].label : ''}">
                    <input type="text" id="${lang}-link-url-${id}" placeholder="URL" value="${data ? data.url : ''}">
                    ${lang === 'fr' ? `<button class="btn btn-secondary" onclick="removeLink(${id})">×</button>` : '<span></span>'}
                `;
                container.appendChild(div);
            });
        }

        function removeLink(id) {
            document.getElementById(`link-${id}-fr`).remove();
            document.getElementById(`link-${id}-es`).remove();
        }

        function getData() {
            const data = {
                date: document.getElementById('article-date').value,
                fr: {
                    title: document.getElementById('fr-title').value,
                    intro: document.getElementById('fr-intro').value,
                    conclusion: document.getElementById('fr-conclusion').value,
                    linksTitle: document.getElementById('fr-links-title').value,
                    sections: [],
                    links: []
                },
                es: {
                    title: document.getElementById('es-title').value,
                    intro: document.getElementById('es-intro').value,
                    conclusion: document.getElementById('es-conclusion').value,
                    linksTitle: document.getElementById('es-links-title').value,
                    sections: [],
                    links: []
                }
            };

            // Collect sections
            const sectionDivs = document.getElementById('fr-sections').children;
            for (let div of sectionDivs) {
                const id = div.id.split('-')[1];
                data.fr.sections.push({
                    title: document.getElementById(`fr-section-title-${id}`).value,
                    text: document.getElementById(`fr-section-text-${id}`).value
                });
                data.es.sections.push({
                    title: document.getElementById(`es-section-title-${id}`).value,
                    text: document.getElementById(`es-section-text-${id}`).value
                });
            }

            // Collect links
            const linkDivs = document.getElementById('fr-links').children;
            for (let div of linkDivs) {
                const id = div.id.split('-')[1];
                const url = document.getElementById(`fr-link-url-${id}`).value;
                data.fr.links.push({
                    label: document.getElementById(`fr-link-label-${id}`).value,
                    url: url
                });
                data.es.links.push({
                    label: document.getElementById(`es-link-label-${id}`).value,
                    url: url
                });
            }

            return data;
        }

        function exportJSON() {
            const data = getData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `article-${data.fr.title.toLowerCase().replace(/\s+/g, '-') || 'untitled'}.json`;
            a.click();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = JSON.parse(e.target.result);
                // Clear existing
                document.getElementById('fr-sections').innerHTML = '';
                document.getElementById('es-sections').innerHTML = '';
                document.getElementById('fr-links').innerHTML = '';
                document.getElementById('es-links').innerHTML = '';
                sectionCount = 0;
                linkCount = 0;

                // Set values
                document.getElementById('article-date').value = data.date;
                ['fr', 'es'].forEach(lang => {
                    document.getElementById(`${lang}-title`).value = data[lang].title;
                    document.getElementById(`${lang}-intro`).value = data[lang].intro;
                    document.getElementById(`${lang}-conclusion`).value = data[lang].conclusion;
                    document.getElementById(`${lang}-links-title`).value = data[lang].linksTitle;
                });

                // Add sections
                for (let i = 0; i < data.fr.sections.length; i++) {
                    addSection({
                        fr: data.fr.sections[i],
                        es: data.es.sections[i]
                    });
                }

                // Add links
                for (let i = 0; i < data.fr.links.length; i++) {
                    addLink({
                        url: data.fr.links[i].url,
                        fr: { label: data.fr.links[i].label },
                        es: { label: data.es.links[i].label }
                    });
                }
            };
            reader.readAsText(file);
        }

        async function generateHTML() {
        const data = getData();
        const formattedDate = data.date.split('-').reverse().join('/');
        
        // Generate content HTML
        const generateContent = (lang) => {
            let html = `<p data-i18n="article_intro">${data[lang].intro}</p>`;
            data[lang].sections.forEach((s, i) => {
                html += `
      <h2 data-i18n="section_title_${i}">${s.title}</h2>
      <p data-i18n="section_text_${i}">${s.text}</p>`;
            });
            
            if (data[lang].links.length > 0) {
                html += `
      <div class="card" style="margin: 2rem 0; background: var(--bg-darker);">
          <h3 data-i18n="useful_links_title">${data[lang].linksTitle}</h3>
          <ul class="small">`;
                data[lang].links.forEach((l, i) => {
                    html += `
              <li><a href="${l.url}" data-i18n="link_${i}">${l.label}</a></li>`;
                });
                html += `
          </ul>
      </div>`;
            }

            html += `
      <p data-i18n="article_conclusion">${data[lang].conclusion}</p>`;
            return html;
        };

        // Generate translations object
        const translations = {
            fr: {
                subtitle: "Association Latino‑américaine d'Albi",
                nav_about: "À propos",
                nav_events: "Événements",
                nav_articles: "Articles",
                nav_membership: "Adhésion",
                nav_contact: "Contact",
                back_to_articles: "← Retour aux articles",
                article_title: data.fr.title,
                published_on: "Publié le",
                article_intro: data.fr.intro,
                article_conclusion: data.fr.conclusion,
                useful_links_title: data.fr.linksTitle
            },
            es: {
                subtitle: "Asociación Latinoamericana de Albi",
                nav_about: "Sobre nosotros",
                nav_events: "Eventos",
                nav_articles: "Artículos",
                nav_membership: "Afiliación",
                nav_contact: "Contacto",
                back_to_articles: "← Volver a los artículos",
                article_title: data.es.title,
                published_on: "Publicado el",
                article_intro: data.es.intro,
                article_conclusion: data.es.conclusion,
                useful_links_title: data.es.linksTitle
            }
        };

        data.fr.sections.forEach((s, i) => {
            translations.fr[`section_title_${i}`] = s.title;
            translations.fr[`section_text_${i}`] = s.text;
            translations.es[`section_title_${i}`] = data.es.sections[i].title;
            translations.es[`section_text_${i}`] = data.es.sections[i].text;
        });

        data.fr.links.forEach((l, i) => {
            translations.fr[`link_${i}`] = l.label;
            translations.es[`link_${i}`] = data.es.links[i].label;
        });

        const htmlTemplate = `<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="article_title">${data.fr.title} — ALMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="container">
    <div class="nav" role="navigation" aria-label="Navigation principale">
      <div class="brand">
        <a href="../index.html" style="display:flex; align-items:center; gap:.75rem; color:inherit">
          <div class="logo" aria-hidden="true">
            <img src="../resources/logo_alma.svg" alt="Logo" height="50">
          </div>
          <div>
            <div style="font-weight:800">ALMA</div>
            <div class="small" data-i18n="subtitle">Association Latino‑américaine d'Albi</div>
          </div>
        </a>
      </div>

      <nav class="main-nav">
        <div id="langSwitch" class="lang-switch" role="switch" aria-checked="false" tabindex="0" aria-label="Changer de langue">
          <span class="lang-label left">FR</span>
          <span class="lang-label right">ES</span>
          <span class="lang-thumb"></span>
        </div>
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mobileMenu">☰</button>
        <ul class="desktop-menu">
          <li><a href="../index.html#apropos" data-i18n="nav_about">À propos</a></li>
          <li><a href="../index.html#evenements" data-i18n="nav_events">Événements</a></li>
          <li><a href="../index.html#articles" data-i18n="nav_articles">Articles</a></li>
          <li><a href="../index.html#adhesion" data-i18n="nav_membership">Adhésion</a></li>
          <li><a href="../index.html#contact" data-i18n="nav_contact">Contact</a></li>
        </ul>
      </nav>
    </div>
    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <ul>
        <li><a href="../index.html#apropos" data-i18n="nav_about">À propos</a></li>
        <li><a href="../index.html#evenements" data-i18n="nav_events">Événements</a></li>
        <li><a href="../index.html#articles" data-i18n="nav_articles">Articles</a></li>
        <li><a href="../index.html#adhesion" data-i18n="nav_membership">Adhésion</a></li>
        <li><a href="../index.html#contact" data-i18n="nav_contact">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <article style="max-width: 800px; margin: 0 auto;">
      <a href="index.html" class="small" data-i18n="back_to_articles" style="display:inline-block; margin-bottom:1rem">← Retour aux articles</a>
      
      <h1 data-i18n="article_title">${data.fr.title}</h1>
      <div class="muted small" style="margin-bottom: 2rem;">
          <span data-i18n="published_on">Publié le</span> : ${formattedDate}
      </div>

      <div class="article-content">
          ${generateContent('fr')}
      </div>
    </article>
  </main>

  <footer class="container">
    <div class="small">© ALMA — Association Latino‑américaine d'Albi</div>
  </footer>

  <script>
    const translations = ${JSON.stringify(translations, null, 2)};

    let currentLang = 'fr';
    const toggle = document.getElementById('langSwitch');

    function updateUrl(lang) {
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.pushState({}, '', url);
    }

    function updateLang(lang, fromUserInteraction) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
      });
      if (fromUserInteraction) {
        updateUrl(lang);
      }
      toggle.classList.toggle('es', lang === 'es');
      toggle.setAttribute('aria-checked', lang === 'es');

      // Update links to include lang param
      document.querySelectorAll('a').forEach(a => {
          if (a.hostname === window.location.hostname) {
              try {
                  const url = new URL(a.href);
                  url.searchParams.set('lang', lang);
                  a.href = url.toString();
              } catch (e) {}
          }
      });
    }

    function toggleLang(){
      currentLang = currentLang === 'fr' ? 'es' : 'fr';
      updateLang(currentLang, true);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const langFromUrl = urlParams.get('lang');
    if (langFromUrl === 'es' || langFromUrl === 'fr') {
      currentLang = langFromUrl;
    } else {
      const browserLang = navigator.language.slice(0, 2);
      if (browserLang === 'es') {
        currentLang = 'es';
        updateUrl('es');
      }
    }
    updateLang(currentLang);

    toggle.addEventListener('click', toggleLang);
    toggle.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' ') toggleLang(); });

    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    menuBtn.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', isOpen);
      mobileMenu.setAttribute('aria-hidden', !isOpen);
    });
  <\/script>
</body>
</html>`;

            const blob = new Blob([htmlTemplate], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${data.fr.title.toLowerCase().replace(/\s+/g, '-') || 'article'}.html`;
            a.click();
        }
    </script>
</body>
</html>
