about_title = "Sobre nosotros"
about_text = "La Asociación Latinoamericana de Albi (ALMA) es una asociación cultural que trabaja para hacer vivir y compartir las culturas de América Latina en Albi y en el Tarn. A través de eventos festivos, encuentros conviviales, talleres lingüísticos y acciones solidarias, crea puentes entre las comunidades y fomenta el intercambio, la ayuda mutua y el acercamiento a las tradiciones latinoamericanas."
