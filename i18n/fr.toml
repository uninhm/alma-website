about_title = "À propos"
about_text = "L’Association Latino-Américana d’Albi (ALMA) est une association culturelle qui œuvre pour faire vivre et partager les cultures d’Amérique latine à Albi et dans le Tarn. À travers des événements festifs, des rencontres conviviales, des ateliers linguistiques et des actions solidaires, elle crée des passerelles entre les communautés et favorise l’échange, l’entraide et la découverte des traditions latino-américaines."
